<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b0704; color: #fff; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .bg-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/dirt.png'); background-repeat: repeat; background-size: 64px 64px; image-rendering: pixelated; z-index: 1; }
        .bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(5, 3, 2, 0.85); z-index: 2; }
        
        /* Top Navigation Bar - Completely clean, absolute zero borders/lines */
        .navbar { position: absolute; top: 0; left: 0; width: 100%; display: flex; justify-content: flex-start; align-items: center; padding: 20px 40px; gap: 25px; z-index: 4; background: rgba(0, 0, 0, 0.4); border: none; }
        .navbar a { color: #aaaaaa; text-decoration: none; font-size: 16px; font-weight: bold; text-shadow: 2px 2px #000; transition: color 0.2s; border: none; background: transparent; }
        .navbar a:hover { color: #ffffff; text-decoration: underline; }
        .navbar a.active { color: #4ade80; }

        .main-container { position: relative; z-index: 3; display: flex; align-items: center; justify-content: center; gap: 50px; margin-top: 40px; }
        
        /* Ensure beaver image displays properly without collapsing */
        .beaver-img { width: 300px; height: auto; max-width: none; border: none; box-shadow: 0 5px 20px rgba(0,0,0,0.8); image-rendering: pixelated; display: block; object-fit: contain; }

        .content { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .logo-container { position: relative; margin-bottom: 20px; display: inline-block; }
        .logo { width: 380px; height: auto; image-rendering: pixelated; display: block; filter: drop-shadow(4px 4px 0px #000); border: none; }

        .welcome-text { color: #4ade80; font-size: 15px; margin-bottom: 15px; text-shadow: 1px 1px #000; font-weight: bold; }

        .links { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .links a { color: #f472b6; text-decoration: none; font-size: 16px; font-weight: bold; text-shadow: 1px 1px #000; border: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <script>
        if (sessionStorage.getItem('isAuthenticated') !== 'true') {
            window.location.href = '/login.html';
        }
    </script>

    <div class="bg-container"></div>
    <div class="bg-overlay"></div>
    
    <!-- Top Navigation Menu -->
    <div class="navbar">
        <a href="index.html" class="active">Home</a>
        <a href="launcher.html">Лаунчер</a>
        <a href="login.html" onclick="sessionStorage.clear()">Выйти из аккаунта</a>
    </div>

    <div class="main-container">
        <img src="beaver.png" alt="Beaver" class="beaver-img">
        
        <div class="content">
            <div class="logo-container">
                <img src="https://fontmeme.com/permalink/230713/minecraft-font.png" alt="Minecraft" class="logo">
            </div>

            <div id="welcomeMsg" class="welcome-text"></div>

            <div class="links">
                <a href="#" id="videoDownloadBtn" class="video-link">Скачать видео furry femboy</a>
            </div>
        </div>
    </div>

    <script>
        const username = sessionStorage.getItem('username');
        if (username) {
            document.getElementById('welcomeMsg').innerText = `Добро пожаловать, ${username}!`;
        }

        document.getElementById('videoDownloadBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const blob = new Blob(["Placeholder for furry femboy video content"], { type: "text/plain" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href, a.download = url, "furry_femboy_video.mp4";
            // fix download trigger cleanly
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.download = "furry_femboy_video.mp4";
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(downloadAnchor);
        });
    </script>
</body>
</html>
